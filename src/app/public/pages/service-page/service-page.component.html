<app-jumbotron2 [jumbotron2Config]="jumbotronConfig"></app-jumbotron2>
<!-- Overview -->
<div [ngClass]="{'bg-primary-subtle' : true}">
    <div class="container py-5">
        <div class="row">
            <div class="col-md-7 fs-5">
                <p class="fs-2 fw-bold" [innerHTML]="Overview.title"></p>
                <p class="card-text fs-5 lh-base" [innerHTML]="Overview.description"></p>
            </div>
            <div class="col-md-5">
                <div class="container fs-5">
                    <div class="row row-cols-2">
                        @for(m of Overview.metrics; track $index) {
                        <div class="col-6 vstack border-bottom border-black p-3">
                            <div class="fw-bold display-6" [innerHTML]="m.value">a</div>
                            <div [innerHTML]="m.label">a</div>
                        </div>
                        }
                    </div>
                </div>
            </div>
        </div>
        <div class="d-none">
            <p class="lead small"></p>
            <h1 class="display-5 fw-bold"></h1>
            <p class="col-md-8 fs-5 lead" [innerHTML]="Overview | json"></p>
            <button class="btn btn-primary btn-lg" type="button">Example button</button>
        </div>
    </div>
</div>
<div class="container my-5">
    <!-- Service Offering -->
    <div class="row">
        <p class="col-12 fs-2 fw-bold" [innerHTML]="ServiceOffering.title"></p>
    </div>
    <div class="row pb-3">
        @for(so of ServiceOffering.services; track $index) {
        <div class="col-md-3">
            <div class="card p-4 shadow-md h-100">
                <div class="card-body p-0">
                    <h4 class="card-title fw-bold mb-4" [innerHTML]="so.name">Card title</h4>
                    <h6 class="card-subtitle mb-2 text-body-secondary"></h6>
                    <div class="card-text fs-5 lh-base" [innerHTML]="so.description"></div>
                </div>
            </div>
        </div>
        }
    </div>

    <!-- Experties -->
    <div class="row">
        <p class="col-12 fs-2 fw-bold" [innerHTML]="Expertise.title"></p>
    </div>
    <div class="row pb-3">
        @for(e of Expertise.items; track $index) {
        <div class="col-md-4">
            <div class="card p-4 shadow-md h-100" style=" background-color: #ffffff;">
                <div class="card-body p-0 ">
                    <!-- Header Row: Logo Placeholder & Title -->
                    <div class="d-flex align-items-center mb-4">
                        <img [attr.src]="e.icon" alt="Tableau Logo" class="me-3" style="width: 60px; height: 60px; object-fit: contain;">
                        <h2 class="card-title fw-bold m-0" [innerHTML]="e.technology">Tableau</h2>
                    </div>
                    <!-- Body Text -->
                    <p class="card-text fs-5 lh-base mb-2" [innerHTML]="e.description"></p>
                </div>
                <div class="card-footer p-0 bg-transparent border-0 ">
                    <!-- Action Link -->
                    <a href="#" class="icon-link text-decoration-none fw-bold d-flex align-items-center">
                        <span>Read More</span>
                        <span class="ms-2 fs-4"> <i class="bi bi-arrow-right"></i></span>
                    </a>
                </div>
            </div>
        </div>
        }
    </div>
    <p class="p-3 bg-info d-none" [innerHTML]="serviceData | json"></p>
</div>
