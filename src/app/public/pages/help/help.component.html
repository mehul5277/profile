    <ng-container *ngTemplateOutlet="helpApplication"></ng-container>
</ng-container> -->
<div class="container-fluid  py-4">
    <p class="p-3 text-primary-emphasis bg-primary-subtle border border-primary-subtle ">ng build --output-path docs --base-href /profile/ --configuration production</p>
    <h5 class="display-6">Bookmark</h5>
    <div class="row">
        @for (topic of helpTopics; track $index) {
        <div class="col-4 mb-4">
            <h3 class="sticky-top">{{ topic.stack }}</h3>
            <p>{{ topic.description }}</p>
            <div class="list-group-wrapper">
                <div class="list-group list-group-flush">
                    @for (url of topic.urls; track $index) {
                    <a class="list-group-item text-break" [href]="url" target="_blank">
                        <img class="favicon pe-2" [src]="url | favicon:32" alt="favicon">
                        {{ url }}</a>
                    }
                </div>
            </div>
        </div>}
    </div>
</div>


<ng-template #helpNavbar>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Bookmarks</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="https://portal.azure.com" target="_blank">Azure</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://azure.microsoft.com/en-us/services/" target="_blank">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://azure.microsoft.com/en-us/pricing/" target="_blank">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</ng-template>
