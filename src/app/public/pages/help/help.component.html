    <h5 class="display-6">Bookmark</h5>
    <div class="row">
        @for (topic of helpTopics; track $index) {
        <div class="col-4 mb-4">
            <h3 class="sticky-top">{{ topic.stack }}</h3>
            <p>{{ topic.description }}</p>
            <div class="list-group-wrapper">
                <div class="list-group list-group-flush">
                    @for (url of topic.urls; track $index) {
                    <a class="list-group-item text-break" [href]="url" target="_blank">
                        <img class="favicon pe-2" [src]="url | favicon:32" alt="favicon">
                        {{ url }}</a>
                    }
                </div>
            </div>
        </div>}
    </div>
</div>
