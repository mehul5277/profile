<!-- Fullpage Billboard Section -->

<div class="particles-banner h-100">
    <div [class]="[styleClass, 'js-particles']" id="particles-js"></div>
    <div class="h-100 d-flex align-items-center text-center panel">
        <div class="container">
            <div class="row">
                <div class="col-md-12">

                    <!-- Tagline / Kicker -->
                    <h6 class="text-uppercase tracking-wider fw-bold mb-3" style="letter-spacing: 2px; color:#38BDF8">
                        {{billboardCofig.tagline}}
                    </h6>

                    <svg class="company-logo" aria-hidden="true">
                        <use href="assets/image/techstack.svg#jixo"></use>
                    </svg>

                    <!-- Main Headline -->
                    <h1 class="display-1x fw-extrabold mb-4 text-uppercasex" style="letter-spacing: 2px;">
                        {{billboardCofig.headline}}
                    </h1>

                    <!-- Subtitle -->
                    <p class="lead fs-4 mb-5 text-light opacity-90">
                        {{billboardCofig.subtitle}}
                    </p>
