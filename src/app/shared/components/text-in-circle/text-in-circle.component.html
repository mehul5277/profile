<div class="generator-container">
  <h2>Text in Circle Generator</h2>

  <form [formGroup]="form" class="generator-form">
    <!-- Text Inputs -->
    <div class="section-box">
      <div class="form-group">
        <label for="topText">Top Text:</label>
        <input id="topText" type="text" formControlName="topText" />
      </div>

      <div class="form-group">
        <label for="middleText">Middle Text:</label>
        <input id="middleText" type="text" formControlName="middleText" />
      </div>

      <div class="form-group">
        <label for="bottomText">Bottom Text:</label>
        <input id="bottomText" type="text" formControlName="bottomText" />
      </div>
    </div>

    <!-- Frame Selection & Circle Border/Background Controls -->
    <div class="section-box">
      <div class="form-group">
        <label for="selectedFrame">Misc Frame:</label>
        <select id="selectedFrame" formControlName="selectedFrame">
          @for (frame of miscFrames; track frame.id) {
            <option [value]="frame.id">{{ frame.label }}</option>
          }
        </select>
      </div>

      <!-- Border Thickness Scaling -->
      <div class="form-row">
        <div class="form-group half">
          <label for="outerBorderWidth">Outer Border: {{ outerBorderWidth }}px</label>
          <input id="outerBorderWidth" type="range" min="0" max="14" step="0.5" formControlName="outerBorderWidth" />
        </div>

        <div class="form-group half">
          <label for="innerBorderWidth">Inner Border: {{ innerBorderWidth }}px</label>
          <input id="innerBorderWidth" type="range" min="0" max="14" step="0.5" formControlName="innerBorderWidth" />
        </div>
      </div>

      <!-- Inner & Outer Background Colors -->
      <div class="form-row">
        <div class="form-group half">
          <label for="outerBgColor">Outer Ring BG:</label>
          <div class="color-picker-wrap">
            <input id="outerBgColor" type="color" formControlName="outerBgColor" />
            <span>{{ outerBgColor }}</span>
          </div>
        </div>

        <div class="form-group half">
          <label for="innerBgColor">Inner Circle BG:</label>
          <div class="color-picker-wrap">
            <input id="innerBgColor" type="color" formControlName="innerBgColor" />
            <span>{{ innerBgColor }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Independent Text Animations -->
    <div class="section-box">
      <div class="form-row">
        <div class="form-group half">
          <label for="outerTextAnimation">Outer Text Animation:</label>
          <select id="outerTextAnimation" formControlName="outerTextAnimation">
            @for (anim of outerTextAnimations; track anim.id) {
              <option [value]="anim.id">{{ anim.label }}</option>
            }
          </select>
        </div>

        <div class="form-group half">
          <label for="centerTextAnimation">Center Text Animation:</label>
          <select id="centerTextAnimation" formControlName="centerTextAnimation">
            @for (anim of centerTextAnimations; track anim.id) {
              <option [value]="anim.id">{{ anim.label }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <!-- Frame & Font Formatting -->
    <div class="section-box">
      <div class="form-row">
        <div class="form-group inline">
          <label>Font:</label>
          <label class="radio-label"><input type="radio" formControlName="fontFamily" value="Arial" /> Arial</label>
          <label class="radio-label"><input type="radio" formControlName="fontFamily" value="Times New Roman" /> Times</label>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" formControlName="isAllCaps" /> All caps
        </label>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="frameColor">Border Color:</label>
          <div class="color-picker-wrap">
            <input id="frameColor" type="color" formControlName="frameColor" />
            <span>{{ frameColor }}</span>
          </div>
        </div>

        <div class="form-group half">
          <label for="fontColor">Font Color:</label>
          <div class="color-picker-wrap">
            <input id="fontColor" type="color" formControlName="fontColor" />
            <span>{{ fontColor }}</span>
          </div>
        </div>
      </div>

      <!-- Inner & Outer Text Scaling -->
      <div class="form-row">
        <div class="form-group half">
          <label for="outerTextScale">Outer Text Scale: {{ outerTextScale }}x</label>
          <input id="outerTextScale" type="range" min="0.6" max="1.4" step="0.05" formControlName="outerTextScale" />
        </div>

        <div class="form-group half">
          <label for="middleScale">Inner Text Scale: {{ middleScale }}x</label>
          <input id="middleScale" type="range" min="0.5" max="1.8" step="0.05" formControlName="middleScale" />
        </div>
      </div>

      <!-- Badge Scale & Letter Spacing -->
      <div class="form-row">
        <div class="form-group half">
          <label for="overallScale">Badge Scale: {{ overallScale }}x</label>
          <input id="overallScale" type="range" min="0.6" max="1.15" step="0.05" formControlName="overallScale" />
        </div>

        <div class="form-group half">
          <label for="letterSpacing">Letter Spacing: {{ letterSpacing }}px</label>
          <input id="letterSpacing" type="range" min="0" max="6" step="0.5" formControlName="letterSpacing" />
        </div>
      </div>
    </div>
  </form>

  <!-- Live SVG Preview -->
  <div class="preview-container" #svgContainer>
    <svg
      viewBox="0 0 400 400"
      width="100%"
      height="100%"
      [style.font-family]="fontFamily"
      [attr.class]="'frame-style-' + selectedFrame">

      <!-- Global Scale Group Centered at (200, 200) -->
      <g [attr.transform]="'translate(200, 200) scale(' + overallScale + ') translate(-200, -200)'" class="badge-root">
        
        <!-- Frame Artwork Layer -->
        <g class="frame-layer">
          @switch (selectedFrame) {
            @case ('classic-double') {
              <circle
                cx="200"
                cy="200"
                r="180"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth"
                [attr.fill]="outerBgColor" />
              <circle
                cx="200"
                cy="200"
                r="126"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="innerBorderWidth"
                [attr.fill]="innerBgColor" />
            }

            @case ('scalloped-seal') {
              <path
                [attr.d]="getScallopedPath(200, 200, 194, 178, 36)"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth"
                [attr.fill]="outerBgColor" />
              <circle
                cx="200"
                cy="200"
                r="126"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="innerBorderWidth"
                stroke-dasharray="4 3"
                [attr.fill]="innerBgColor" />
            }

            @case ('rope-ring') {
              <circle
                cx="200"
                cy="200"
                r="184"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth * 0.5"
                [attr.fill]="outerBgColor" />
              <circle
                cx="200"
                cy="200"
                r="179"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth * 1.5"
                stroke-dasharray="8 5"
                stroke-linecap="round"
                fill="none" />
              <circle
                cx="200"
                cy="200"
                r="174"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth * 0.5"
                fill="none" />
              <circle
                cx="200"
                cy="200"
                r="126"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="innerBorderWidth"
                [attr.fill]="innerBgColor" />
            }

            @case ('dotted-crest') {
              <circle
                cx="200"
                cy="200"
                r="183"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth * 0.65"
                [attr.fill]="outerBgColor" />
              <circle
                cx="200"
                cy="200"
                r="176"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth"
                stroke-dasharray="1 9"
                stroke-linecap="round"
                fill="none" />
              <circle
                cx="200"
                cy="200"
                r="126"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="innerBorderWidth"
                [attr.fill]="innerBgColor" />
              <text x="96" y="207" font-size="16" text-anchor="middle" [attr.fill]="frameColor">★</text>
              <text x="304" y="207" font-size="16" text-anchor="middle" [attr.fill]="frameColor">★</text>
            }

            @case ('octagon-emblem') {
              <polygon
                points="273,24 376,127 376,273 273,376 127,376 24,273 24,127 127,24"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth"
                [attr.fill]="outerBgColor" />
              <polygon
                points="269,33 367,131 367,269 269,367 131,367 33,269 33,131 131,33"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="outerBorderWidth * 0.4"
                fill="none" />
              <circle
                cx="200"
                cy="200"
                r="126"
                [attr.stroke]="frameColor"
                [attr.stroke-width]="innerBorderWidth"
                [attr.fill]="innerBgColor" />
            }
          }
        </g>

        <!-- Dynamically Adjusted Curved Text Paths for Outer Text Scaling -->
        <defs>
          <path
            id="topPath"
            [attr.d]="'M ' + (200 - topArcRadius) + ',200 A ' + topArcRadius + ',' + topArcRadius + ' 0 1,1 ' + (200 + topArcRadius) + ',200'" />
          <path
            id="bottomPath"
            [attr.d]="'M ' + (200 - bottomArcRadius) + ',200 A ' + bottomArcRadius + ',' + bottomArcRadius + ' 0 0,0 ' + (200 + bottomArcRadius) + ',200'" />
        </defs>

        <!-- Outer Curved Text Layer -->
        <g [attr.class]="'outer-text-layer outer-anim-' + outerTextAnimation">
          <text
            [attr.font-size]="30 * outerTextScale"
            font-weight="bold"
            [attr.letter-spacing]="letterSpacing"
            [attr.fill]="fontColor">
            <textPath href="#topPath" startOffset="50%" text-anchor="middle">
              {{ isAllCaps ? topText.toUpperCase() : topText }}
            </textPath>
          </text>

          <text
            [attr.font-size]="30 * outerTextScale"
            font-weight="bold"
            [attr.letter-spacing]="letterSpacing"
            [attr.fill]="fontColor">
            <textPath href="#bottomPath" startOffset="50%" text-anchor="middle">
              {{ isAllCaps ? bottomText.toUpperCase() : bottomText }}
            </textPath>
          </text>
        </g>

        <!-- Center / Inner Middle Text Layer -->
        <g [attr.class]="'center-text-layer center-anim-' + centerTextAnimation">
          <text
            x="200"
            [attr.y]="200 + 12 * middleScale"
            [attr.font-size]="34 * middleScale"
            font-weight="bold"
            [attr.letter-spacing]="letterSpacing * 0.75"
            text-anchor="middle"
            [attr.fill]="fontColor">
            {{ isAllCaps ? middleText.toUpperCase() : middleText }}
          </text>
        </g>

      </g>
    </svg>
  </div>

  <!-- Download Buttons -->
  <div class="download-actions">
    <button type="button" (click)="downloadSvg()">Download SVG</button>
    <button type="button" (click)="downloadPng()">Download PNG</button>
  </div>
</div>
